spring.application.name=edificios
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.error.whitelabel.enabled=false

# Base de datos (variables de entorno; nunca credenciales en el repositorio)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/edificios_spring}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# El esquema se crea con db/schema.sql; JPA solo lo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false


spring.thymeleaf.cache=false
server.servlet.session.tracking-modes=cookie

# Correo de recuperacion: 1) API de Brevo (BREVO_API_KEY), 2) SMTP (SMTP_HOST), 3) enlace en el log
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.smtp-host=${SMTP_HOST:}
app.mail.from=${MAIL_FROM:no-reply@edificios.local}
app.mail.from-name=${MAIL_FROM_NAME:Edificios}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000

# Token de recuperacion: base de los enlaces y vigencia
app.base-url=${APP_BASE_URL:${RENDER_EXTERNAL_URL:http://localhost:8080}}
app.reset-token-minutes=30

# Crea la tabla de tokens si no existe (antes de la validacion de JPA)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:token-init.sql