spring.application.name=edificios
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.error.whitelabel.enabled=false

# Base de datos (variables de entorno; nunca credenciales en el repositorio)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/edificios_spring}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# El esquema se crea con db/schema.sql; JPA solo lo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Correo (recuperacion de clave)
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:2525}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
app.mail.from=${SMTP_FROM:no-reply@edificios.local}

spring.thymeleaf.cache=false
